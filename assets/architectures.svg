<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="auto">
  <defs>
    <filter id="brutal-shadow" x="-3%" y="-3%" width="108%" height="108%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#121212" flood-opacity="1"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>

  <!-- Background Base -->
  <rect width="880" height="340" fill="transparent"/>

  <!-- ================= CARD 1: REAL-TIME VOICE AI ================= -->
  <g transform="translate(10, 10)">
    <rect width="420" height="150" rx="10" fill="#FFFFFF" stroke="#121212" stroke-width="2.5" filter="url(#brutal-shadow)"/>
    <!-- Header -->
    <rect x="0" y="0" width="420" height="32" rx="10" fill="#FFE600" stroke="#121212" stroke-width="2.5"/>
    <rect x="0" y="20" width="420" height="12" fill="#FFE600"/>
    <line x1="0" y1="32" x2="420" y2="32" stroke="#121212" stroke-width="2.5"/>
    <text x="14" y="21" class="font-mono" font-size="11" font-weight="900" fill="#121212">01 / REAL-TIME VOICE AI PIPELINE</text>
    <text x="405" y="21" class="font-mono" font-size="10" font-weight="800" fill="#121212" text-anchor="end">&lt;1s LATENCY</text>

    <!-- Flow Diagram -->
    <g transform="translate(14, 52)">
      <!-- Node 1: WebRTC Audio -->
      <rect x="0" y="0" width="85" height="36" rx="6" fill="#FAF8F5" stroke="#121212" stroke-width="1.8"/>
      <text x="42" y="16" class="font-mono" font-size="9" font-weight="800" fill="#121212" text-anchor="middle">Push-To-Talk</text>
      <text x="42" y="28" class="font-mono" font-size="8" font-weight="600" fill="#121212" opacity="0.7" text-anchor="middle">WebRTC Audio</text>

      <path d="M 85 18 L 110 18" stroke="#121212" stroke-width="2" marker-end="url(#arrow)"/>
      <polygon points="110,18 104,14 104,22" fill="#121212"/>

      <!-- Node 2: Pipecat / LiveKit -->
      <rect x="115" y="0" width="115" height="36" rx="6" fill="#FFE600" stroke="#121212" stroke-width="1.8"/>
      <text x="172" y="16" class="font-mono" font-size="9" font-weight="800" fill="#121212" text-anchor="middle">Pipecat + LiveKit</text>
      <text x="172" y="28" class="font-mono" font-size="8" font-weight="600" fill="#121212" opacity="0.7" text-anchor="middle">Orchestration DAG</text>

      <path d="M 230 18 L 255 18" stroke="#121212" stroke-width="2"/>
      <polygon points="255,18 249,14 249,22" fill="#121212"/>

      <!-- Node 3: Grounded Audio Out -->
      <rect x="260" y="0" width="130" height="36" rx="6" fill="#FAF8F5" stroke="#121212" stroke-width="1.8"/>
      <text x="325" y="16" class="font-mono" font-size="9" font-weight="800" fill="#121212" text-anchor="middle">Grounded LLM</text>
      <text x="325" y="28" class="font-mono" font-size="8" font-weight="600" fill="#FF6B00" text-anchor="middle">Voice Stream Out 🎙️</text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(14, 114)">
      <rect width="80" height="18" rx="4" fill="#FAF8F5" stroke="#121212" stroke-width="1.2"/>
      <text x="40" y="12.5" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">LIVEKIT</text>

      <rect x="88" width="75" height="18" rx="4" fill="#FAF8F5" stroke="#121212" stroke-width="1.2"/>
      <text x="125" y="12.5" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">PIPECAT</text>

      <rect x="171" width="95" height="18" rx="4" fill="#FAF8F5" stroke="#121212" stroke-width="1.2"/>
      <text x="218" y="12.5" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">SUB-SECOND AUDIO</text>

      <rect x="274" width="116" height="18" rx="4" fill="#10B981" stroke="#121212" stroke-width="1.2"/>
      <text x="332" y="12.5" class="font-mono" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">PRODUCTION READY</text>
    </g>
  </g>

  <!-- ================= CARD 2: CROSS-LINGUAL RAG ================= -->
  <g transform="translate(450, 10)">
    <rect width="420" height="150" rx="10" fill="#FFFFFF" stroke="#121212" stroke-width="2.5" filter="url(#brutal-shadow)"/>
    <!-- Header -->
    <rect x="0" y="0" width="420" height="32" rx="10" fill="#FF6B00" stroke="#121212" stroke-width="2.5"/>
    <rect x="0" y="20" width="420" height="12" fill="#FF6B00"/>
    <line x1="0" y1="32" x2="420" y2="32" stroke="#121212" stroke-width="2.5"/>
    <text x="14" y="21" class="font-mono" font-size="11" font-weight="900" fill="#FFFFFF">02 / CROSS-LINGUAL RAG ENGINE</text>
    <text x="405" y="21" class="font-mono" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="end">PGVECTOR</text>

    <!-- Flow Diagram -->
    <g transform="translate(14, 52)">
      <!-- Node 1: Multilingual Query -->
      <rect x="0" y="0" width="100" height="36" rx="6" fill="#FAF8F5" stroke="#121212" stroke-width="1.8"/>
      <text x="50" y="16" class="font-mono" font-size="9" font-weight="800" fill="#121212" text-anchor="middle">Hindi / Marathi</text>
      <text x="50" y="28" class="font-mono" font-size="8" font-weight="600" fill="#FF6B00" text-anchor="middle">Natural Language</text>

      <path d="M 100 18 L 125 18" stroke="#121212" stroke-width="2"/>
      <polygon points="125,18 119,14 119,22" fill="#121212"/>

      <!-- Node 2: pgvector Index -->
      <rect x="130" y="0" width="115" height="36" rx="6" fill="#FFE600" stroke="#121212" stroke-width="1.8"/>
      <text x="187" y="16" class="font-mono" font-size="9" font-weight="800" fill="#121212" text-anchor="middle">Cosine Distance</text>
      <text x="187" y="28" class="font-mono" font-size="8" font-weight="600" fill="#121212" opacity="0.7" text-anchor="middle">PostgreSQL / Vector</text>

      <path d="M 245 18 L 270 18" stroke="#121212" stroke-width="2"/>
      <polygon points="270,18 264,14 264,22" fill="#121212"/>

      <!-- Node 3: Grounded English Records -->
      <rect x="275" y="0" width="115" height="36" rx="6" fill="#FAF8F5" stroke="#121212" stroke-width="1.8"/>
      <text x="332" y="16" class="font-mono" font-size="9" font-weight="800" fill="#121212" text-anchor="middle">English Match</text>
      <text x="332" y="28" class="font-mono" font-size="8" font-weight="600" fill="#10B981" text-anchor="middle">Anti-Hallucination</text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(14, 114)">
      <rect width="90" height="18" rx="4" fill="#FAF8F5" stroke="#121212" stroke-width="1.2"/>
      <text x="45" y="12.5" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">POSTGRESQL</text>

      <rect x="98" width="80" height="18" rx="4" fill="#FAF8F5" stroke="#121212" stroke-width="1.2"/>
      <text x="138" y="12.5" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">PGVECTOR</text>

      <rect x="186" width="95" height="18" rx="4" fill="#FAF8F5" stroke="#121212" stroke-width="1.2"/>
      <text x="233" y="12.5" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">CROSS-LINGUAL</text>

      <rect x="289" width="101" height="18" rx="4" fill="#121212" stroke="#121212" stroke-width="1.2"/>
      <text x="339" y="12.5" class="font-mono" font-size="8" font-weight="800" fill="#FFE600" text-anchor="middle">ZERO-HALLUCINATE</text>
    </g>
  </g>

  <!-- ================= CARD 3: SYNTHIA-GRAPH ================= -->
  <g transform="translate(10, 180)">
    <rect width="420" height="150" rx="10" fill="#FFFFFF" stroke="#121212" stroke-width="2.5" filter="url(#brutal-shadow)"/>
    <!-- Header -->
    <rect x="0" y="0" width="420" height="32" rx="10" fill="#121212" stroke="#121212" stroke-width="2.5"/>
    <rect x="0" y="20" width="420" height="12" fill="#121212"/>
    <line x1="0" y1="32" x2="420" y2="32" stroke="#121212" stroke-width="2.5"/>
    <text x="14" y="21" class="font-mono" font-size="11" font-weight="900" fill="#FFE600">03 / SYNTHIA-GRAPH MULTI-AGENT DAG</text>
    <text x="405" y="21" class="font-mono" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="end">10 AGENTS</text>

    <!-- Flow Diagram -->
    <g transform="translate(14, 52)">
      <!-- Node 1: Paper Ingestion -->
      <rect x="0" y="0" width="90" height="36" rx="6" fill="#FAF8F5" stroke="#121212" stroke-width="1.8"/>
      <text x="45" y="16" class="font-mono" font-size="9" font-weight="800" fill="#121212" text-anchor="middle">Research Ingest</text>
      <text x="45" y="28" class="font-mono" font-size="8" font-weight="600" fill="#121212" opacity="0.7" text-anchor="middle">arXiv / PDFs</text>

      <path d="M 90 18 L 115 18" stroke="#121212" stroke-width="2"/>
      <polygon points="115,18 109,14 109,22" fill="#121212"/>

      <!-- Node 2: 10 Specialized Agents -->
      <rect x="120" y="0" width="130" height="36" rx="6" fill="#FFE600" stroke="#121212" stroke-width="1.8"/>
      <text x="185" y="16" class="font-mono" font-size="9" font-weight="800" fill="#121212" text-anchor="middle">10 Agent DAG Loop</text>
      <text x="185" y="28" class="font-mono" font-size="8" font-weight="600" fill="#FF6B00" text-anchor="middle">Critique &amp; Refine</text>

      <path d="M 250 18 L 275 18" stroke="#121212" stroke-width="2"/>
      <polygon points="275,18 269,14 269,22" fill="#121212"/>

      <!-- Node 3: IEEE Format -->
      <rect x="280" y="0" width="110" height="36" rx="6" fill="#FAF8F5" stroke="#121212" stroke-width="1.8"/>
      <text x="335" y="16" class="font-mono" font-size="9" font-weight="800" fill="#121212" text-anchor="middle">IEEE Publication</text>
      <text x="335" y="28" class="font-mono" font-size="8" font-weight="600" fill="#10B981" text-anchor="middle">Ready Docx 📄</text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(14, 114)">
      <rect width="90" height="18" rx="4" fill="#FAF8F5" stroke="#121212" stroke-width="1.2"/>
      <text x="45" y="12.5" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">LANGGRAPH</text>

      <rect x="98" width="90" height="18" rx="4" fill="#FAF8F5" stroke="#121212" stroke-width="1.2"/>
      <text x="143" y="12.5" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">MULTI-AGENT</text>

      <rect x="196" width="85" height="18" rx="4" fill="#FAF8F5" stroke="#121212" stroke-width="1.2"/>
      <text x="238" y="12.5" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">IEEE COMPLIANT</text>

      <rect x="289" width="101" height="18" rx="4" fill="#FFE600" stroke="#121212" stroke-width="1.2"/>
      <text x="339" y="12.5" class="font-mono" font-size="8" font-weight="800" fill="#121212" text-anchor="middle">AUTONOMOUS</text>
    </g>
  </g>

  <!-- ================= CARD 4: MULTIMODAL GENAI VIDEOS ================= -->
  <g transform="translate(450, 180)">
    <rect width="420" height="150" rx="10" fill="#FFFFFF" stroke="#121212" stroke-width="2.5" filter="url(#brutal-shadow)"/>
    <!-- Header -->
    <rect x="0" y="0" width="420" height="32" rx="10" fill="#FAF8F5" stroke="#121212" stroke-width="2.5"/>
    <rect x="0" y="20" width="420" height="12" fill="#FAF8F5"/>
    <line x1="0" y1="32" x2="420" y2="32" stroke="#121212" stroke-width="2.5"/>
    <text x="14" y="21" class="font-mono" font-size="11" font-weight="900" fill="#121212">04 / MULTIMODAL GENAI VIDEO ENGINE</text>
    <text x="405" y="21" class="font-mono" font-size="10" font-weight="800" fill="#FF6B00" text-anchor="end">YOUTUBE MUSIC</text>

    <!-- Flow Diagram -->
    <g transform="translate(14, 52)">
      <!-- Node 1: Google Flow Clips -->
      <rect x="0" y="0" width="95" height="36" rx="6" fill="#FAF8F5" stroke="#121212" stroke-width="1.8"/>
      <text x="47" y="16" class="font-mono" font-size="9" font-weight="800" fill="#121212" text-anchor="middle">Google Flow</text>
      <text x="47" y="28" class="font-mono" font-size="8" font-weight="600" fill="#121212" opacity="0.7" text-anchor="middle">Clip Generation</text>

      <path d="M 95 18 L 120 18" stroke="#121212" stroke-width="2"/>
      <polygon points="120,18 114,14 114,22" fill="#121212"/>

      <!-- Node 2: Python Consistency Engine -->
      <rect x="125" y="0" width="130" height="36" rx="6" fill="#FFE600" stroke="#121212" stroke-width="1.8"/>
      <text x="190" y="16" class="font-mono" font-size="9" font-weight="800" fill="#121212" text-anchor="middle">Python Consistency</text>
      <text x="190" y="28" class="font-mono" font-size="8" font-weight="600" fill="#FF6B00" text-anchor="middle">Character &amp; Scene Locks</text>

      <path d="M 255 18 L 280 18" stroke="#121212" stroke-width="2"/>
      <polygon points="280,18 274,14 274,22" fill="#121212"/>

      <!-- Node 3: Commercial Master Release -->
      <rect x="285" y="0" width="105" height="36" rx="6" fill="#FAF8F5" stroke="#121212" stroke-width="1.8"/>
      <text x="337" y="16" class="font-mono" font-size="9" font-weight="800" fill="#121212" text-anchor="middle">Commercial Master</text>
      <text x="337" y="28" class="font-mono" font-size="8" font-weight="600" fill="#FF6B00" text-anchor="middle">YouTube Release 🎬</text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(14, 114)">
      <rect width="90" height="18" rx="4" fill="#FAF8F5" stroke="#121212" stroke-width="1.2"/>
      <text x="45" y="12.5" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">GOOGLE FLOW</text>

      <rect x="98" width="95" height="18" rx="4" fill="#FAF8F5" stroke="#121212" stroke-width="1.2"/>
      <text x="145" y="12.5" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">CHARACTER LOCK</text>

      <rect x="201" width="95" height="18" rx="4" fill="#FAF8F5" stroke="#121212" stroke-width="1.2"/>
      <text x="248" y="12.5" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">AUTO CAPTIONS</text>

      <rect x="304" width="86" height="18" rx="4" fill="#FF6B00" stroke="#121212" stroke-width="1.2"/>
      <text x="347" y="12.5" class="font-mono" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">2 SONGS LIVE</text>
    </g>
