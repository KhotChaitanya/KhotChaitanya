<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="auto">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#121212" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#121212" flood-opacity="1"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>

  <!-- Main Card Container with Brutalist Shadow -->
  <rect x="6" y="6" width="900" height="260" rx="16" fill="#FAF8F5" stroke="#121212" stroke-width="3" filter="url(#shadow)"/>
  <rect x="6" y="6" width="900" height="260" rx="16" fill="url(#grid)"/>

  <!-- Left Content Group -->
  <g transform="translate(42, 38)">
    
    <!-- Top Status Pill -->
    <g>
      <rect width="260" height="26" rx="13" fill="#FFFFFF" stroke="#121212" stroke-width="2"/>
      <circle cx="15" cy="13" r="4.5" fill="#10B981"/>
      <text x="28" y="17" class="font-mono" font-size="10" font-weight="700" fill="#121212" letter-spacing="0.8">AI/ML ENGINEER @ ADA LOVELACE TECH</text>
    </g>

    <!-- Main Name Headline -->
    <text x="0" y="78" class="font-sans" font-size="44" font-weight="900" fill="#121212" letter-spacing="-1">
      Chaitanya Khot<tspan fill="#FF6B00">.</tspan>
    </text>

    <!-- Focus Banner (Solar Yellow Neo-Brutalist Box) -->
    <g transform="translate(0, 96)">
      <rect width="450" height="34" fill="#FFE600" stroke="#121212" stroke-width="2.5"/>
      <text x="16" y="22" class="font-mono" font-size="12" font-weight="800" fill="#121212" letter-spacing="1">
        AGENTIC AI • MULTILINGUAL VOICE AI • RAG
      </text>
    </g>

    <!-- Description / Bio Snippet -->
    <text x="0" y="156" class="font-sans" font-size="13" font-weight="500" fill="#121212" opacity="0.85">
      Building low-latency production AI systems, WebRTC voice agents, and multi-agent DAGs.
    </text>

    <!-- Quick Credentials Pills -->
    <g transform="translate(0, 174)">
      <g>
        <rect width="138" height="24" rx="6" fill="#FFFFFF" stroke="#121212" stroke-width="1.8"/>
        <text x="69" y="16" class="font-mono" font-size="10" font-weight="700" fill="#121212" text-anchor="middle">1+ YR PRODUCTION</text>
      </g>
      <g transform="translate(146, 0)">
        <rect width="158" height="24" rx="6" fill="#FFFFFF" stroke="#121212" stroke-width="1.8"/>
        <text x="79" y="16" class="font-mono" font-size="10" font-weight="700" fill="#121212" text-anchor="middle">MCA (8.79) • PGDBDA (8.80)</text>
      </g>
      <g transform="translate(312, 0)">
        <rect width="145" height="24" rx="6" fill="#FF6B00" stroke="#121212" stroke-width="1.8"/>
        <text x="72" y="16" class="font-mono" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">NAVI MUMBAI / PUNE</text>
      </g>
    </g>

  </g>

  <!-- Right Geometric AI Architecture Graph (Matching Portfolio Neural Halo) -->
  <g transform="translate(560, 25)">
    <!-- Soft Background Halo Circle -->
    <circle cx="160" cy="115" r="95" fill="#FFE600" fill-opacity="0.35" stroke="#121212" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="90" y="45" width="140" height="140" rx="20" fill="#FF6B00" fill-opacity="0.18" stroke="#121212" stroke-width="2" transform="rotate(18 160 115)"/>

    <!-- Neural DAG Connectors -->
    <line x1="30" y1="70" x2="115" y2="40" stroke="#121212" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="30" y1="70" x2="115" y2="115" stroke="#121212" stroke-width="2.5"/>
    <line x1="30" y1="160" x2="115" y2="115" stroke="#121212" stroke-width="2.5"/>
    <line x1="30" y1="160" x2="115" y2="185" stroke="#121212" stroke-width="2" stroke-dasharray="3 3"/>

    <line x1="115" y1="40" x2="215" y2="70" stroke="#121212" stroke-width="2.5"/>
    <line x1="115" y1="115" x2="215" y2="70" stroke="#121212" stroke-width="2.5"/>
    <line x1="115" y1="115" x2="215" y2="160" stroke="#121212" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="115" y1="185" x2="215" y2="160" stroke="#121212" stroke-width="2.5"/>

    <line x1="215" y1="70" x2="265" y2="115" stroke="#FF6B00" stroke-width="3"/>
    <line x1="215" y1="160" x2="265" y2="115" stroke="#FF6B00" stroke-width="3"/>

    <!-- Input Nodes -->
    <circle cx="30" cy="70" r="14" fill="#FFE600" stroke="#121212" stroke-width="2.5"/>
    <text x="30" y="74" class="font-mono" font-size="9" font-weight="bold" fill="#121212" text-anchor="middle">x₁</text>

    <circle cx="30" cy="160" r="14" fill="#FFE600" stroke="#121212" stroke-width="2.5"/>
    <text x="30" y="164" class="font-mono" font-size="9" font-weight="bold" fill="#121212" text-anchor="middle">x₂</text>

    <!-- Hidden Latent Nodes -->
    <circle cx="115" cy="40" r="16" fill="#FAF8F5" stroke="#121212" stroke-width="2.5"/>
    <text x="115" y="44" class="font-mono" font-size="8" font-weight="bold" fill="#121212" text-anchor="middle">RAG</text>

    <circle cx="115" cy="115" r="18" fill="#FF6B00" stroke="#121212" stroke-width="2.5"/>
    <text x="115" y="119" class="font-mono" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LLM</text>

    <circle cx="115" cy="185" r="16" fill="#FAF8F5" stroke="#121212" stroke-width="2.5"/>
    <text x="115" y="189" class="font-mono" font-size="8" font-weight="bold" fill="#121212" text-anchor="middle">Voice</text>

    <!-- Output & Agent Nodes -->
    <circle cx="215" cy="70" r="17" fill="#FFE600" stroke="#121212" stroke-width="2.5"/>
    <text x="215" y="74" class="font-mono" font-size="8" font-weight="bold" fill="#121212" text-anchor="middle">Agent</text>

    <circle cx="215" cy="160" r="16" fill="#FAF8F5" stroke="#121212" stroke-width="2.5"/>
    <text x="215" y="164" class="font-mono" font-size="7.5" font-weight="bold" fill="#121212" text-anchor="middle">Vector</text>

    <circle cx="265" cy="115" r="16" fill="#FF6B00" stroke="#121212" stroke-width="2.5"/>
    <text x="265" y="119" class="font-mono" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Out</text>

    <!-- Floating Technical Badges -->
    <g transform="translate(40, 2)">
      <rect width="105" height="20" rx="5" fill="#FFFFFF" stroke="#121212" stroke-width="1.8"/>
      <text x="52" y="13" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">Attention(Q,K,V)</text>
    </g>

    <g transform="translate(180, 5)">
      <rect width="95" height="20" rx="5" fill="#FFE600" stroke="#121212" stroke-width="1.8"/>
      <text x="47" y="13" class="font-mono" font-size="8" font-weight="700" fill="#121212" text-anchor="middle">pgvector Latent</text>
    </g>
  </g>
</svg>
